<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autonomous Online Replanning for Quadrotor Landing on a Moving Target</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Project page for autonomous online replanning and quadrotor landing on a moving target.">
<style>
  :root { color-scheme: light; --ink: #202124; --muted: #60656d; --line: #d9dde2;
          --accent: #165d91; --surface: #f5f7f8; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: #fff;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         line-height: 1.5; }
  header { max-width: 1120px; margin: 0 auto; padding: 54px 24px 42px; }
  h1 { max-width: 900px; margin: 0; font-family: Georgia, "Times New Roman", serif;
       font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; line-height: 1.08; }
  .authors { margin: 20px 0 0; color: var(--muted); font-size: 1rem; }
  .venue { margin: 4px 0 0; color: var(--muted); font-size: 0.94rem; }
  main { border-top: 1px solid var(--line); background: var(--surface); }
  section { max-width: 1280px; margin: 0 auto; padding: 38px 24px 52px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between;
                  gap: 20px; margin-bottom: 16px; }
  h2 { margin: 0; font-size: 1.15rem; font-weight: 650; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .visualization { width: 100%; height: min(780px, 78vh); min-height: 580px;
                   display: block; border: 1px solid var(--line); background: #fff; }
  @media (max-width: 640px) {
    header { padding: 36px 18px 30px; }
    section { padding: 28px 12px 36px; }
    .section-head { padding: 0 6px; }
    .visualization { height: 660px; min-height: 0; }
  }
</style>
</head>
<body>
  <header>
    <h1>Autonomous Online Replanning for Quadrotor Landing on a Moving Target</h1>
    <p class="authors">SungJin Noh, Yong-Hee Kim, Joshua Kim, Kwang-Ki K. Kim</p>
    <p class="venue">ICCAS 2026</p>
  </header>
  <main>
    <section aria-labelledby="trajectory-heading">
      <div class="section-head">
        <h2 id="trajectory-heading">Single-horizon trajectory evolution</h2>
        <a href="assets/sh-trajectory-evolution.html">Full-screen view</a>
      </div>
      <iframe class="visualization" src="assets/sh-trajectory-evolution.html"
              title="Interactive single-horizon trajectory evolution"
              loading="lazy" allowfullscreen></iframe>
    </section>
  </main>
</body>
</html>
