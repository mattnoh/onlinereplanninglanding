<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autonomous Online Replanning for Quadrotor Landing on a Moving Target</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Project page for autonomous online replanning and quadrotor landing on a moving target.">
<style>
  :root { color-scheme: light; --ink: #202124; --muted: #60656d; --line: #e2e5e8; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: #fff;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         line-height: 1.5; }
  header { max-width: 1120px; margin: 0 auto; padding: 54px 24px 42px; }
  h1 { margin: 0; font-size: clamp(0.72rem, 2.05vw, 1.75rem); font-weight: 600;
       line-height: 1.2; white-space: nowrap; }
  .authors { margin: 20px 0 0; color: var(--muted); font-size: 1rem; }
  .venue { margin: 4px 0 0; color: var(--muted); font-size: 0.94rem; }
  main { border-top: 1px solid var(--line); background: #fff; }
  section { max-width: 1280px; margin: 0 auto; padding: 18px 24px 48px; }
  .visualization { width: 100%; height: min(780px, 78vh); min-height: 580px;
                   display: block; border: 0; background: #fff; }
  @media (max-width: 640px) {
    header { padding: 36px 18px 30px; }
    section { padding: 12px 0 30px; }
    .visualization { height: 660px; min-height: 0; }
  }
</style>
</head>
<body>
  <header>
    <h1>Autonomous Online Replanning for Quadrotor Landing on a Moving Target</h1>
    <p class="authors">SungJin Noh, Yong-Hee Kim, Joshua Kim, Kwang-Ki K. Kim</p>
    <p class="venue">ICCAS 2026</p>
  </header>
  <main>
    <section aria-label="Single-horizon trajectory evolution">
      <iframe class="visualization" src="assets/sh-trajectory-evolution.html"
              title="Interactive single-horizon trajectory evolution"
              loading="lazy" allowfullscreen></iframe>
    </section>
  </main>
</body>
</html>
